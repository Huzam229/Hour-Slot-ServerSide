server:
  port: 8090

spring:
  application:
    name: hourslot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

  # Fill username/password below to enable outbound email.
  # Restart the backend after changes. Prefer an app password (Gmail), not your login password.
  # Do not commit real credentials to git — use env overrides in shared/prod if needed.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:haseebsardar123123@gmail.com}
    password: ${MAIL_PASSWORD:lkic dyrm ftkl rshd}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000
      refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  r2:
    endpoint: ${R2_ENDPOINT:https://bfdeed5456d05480caaa412d2577bc3d.r2.cloudflarestorage.com}
    region: ${STORAGE_REGION:auto}
    access-key: ${R2_ACCESS_KEY:71bafb759c79a40d0a4e32f1f47ba35b}
    secret-key: ${R2_SECRET_KEY:583347057a28b54a85b337eb521eddb8ad623d4e31c910d7c7921450ca6f9f4e}
    bucket-name: ${R2_BUCKET_NAME:hour-slot}
    public-url: ${R2_PUBLIC_URL:https://pub-c3cf41ff651b40069ed1245ae1b0fad7.r2.dev}
    path-style-access: true
    # R2 often requires chunked encoding disabled for PutObject
    chunked-encoding: false
    folders:
      # Must match folder names already created in the hour-slot bucket
      verification: verification
      business-profile: bussiness_profile
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    commission-percentage: 0.0

logging:
  config: classpath:log4j2-spring.xml

